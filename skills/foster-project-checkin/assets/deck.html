<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>@@TITLE@@ check-in</title>
<style>
:root{--paper:#f6f4ef;--card:#fffefa;--ink:#24342e;--muted:#5f6f66;--line:#d7dcd3;--accent:#276852;--accent-ink:#fff;--call:#b7791f;--call-soft:#f6ead2;--rec:#e3efe8;--cur:#e8e3f3;--done:#2f7d5b;--moving:#3c6e9e;--blocked:#b4462e;--dropped:#8a8f8c;--risk:#b7791f;--focus:#a34d29;--shadow:0 1px 2px #0000000d,0 8px 30px #0000000f}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#161b19;--card:#1f2623;--ink:#e6ebe7;--muted:#9fb0a7;--line:#33403a;--accent:#5cb48f;--accent-ink:#0d1512;--call:#e0a84a;--call-soft:#3a2f1c;--rec:#1f3a2e;--cur:#2e2a3d;--done:#5cb48f;--moving:#7fb0dd;--blocked:#e2836d;--dropped:#8d958f;--risk:#e0a84a;--focus:#f0a070;--shadow:none}}
:root[data-theme=dark]{--paper:#161b19;--card:#1f2623;--ink:#e6ebe7;--muted:#9fb0a7;--line:#33403a;--accent:#5cb48f;--accent-ink:#0d1512;--call:#e0a84a;--call-soft:#3a2f1c;--rec:#1f3a2e;--cur:#2e2a3d;--done:#5cb48f;--moving:#7fb0dd;--blocked:#e2836d;--dropped:#8d958f;--risk:#e0a84a;--focus:#f0a070;--shadow:none}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
a{color:var(--accent)}button,textarea{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}.bar b{color:var(--ink)}.bar span{white-space:nowrap}.bar>span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0}.bar .right{display:flex;gap:14px;align-items:center}.bar button{border:1px solid var(--line);background:transparent;border-radius:6px;padding:3px 9px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.stage{flex:1;display:grid;place-items:center;padding:18px;min-height:0}
.slide{display:none;width:min(100%,calc((100vh - 140px) * 16 / 9));aspect-ratio:16/9;max-height:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:clamp(22px,3.6vw,56px) clamp(24px,4.4vw,70px);overflow:auto;flex-direction:column;container-type:inline-size}
.slide.active{display:flex}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font:400 clamp(28px,4.4cqi,54px)/1.12 Georgia,"Times New Roman",serif;letter-spacing:-.02em;margin:auto 0 24px;max-width:28ch}
h2{font:400 clamp(24px,3.6cqi,44px)/1.15 Georgia,"Times New Roman",serif;letter-spacing:-.015em;margin:12px 0 10px;max-width:30ch}
.lede{font-size:clamp(16px,1.9cqi,22px);max-width:62ch;margin:4px 0 14px}.body{color:var(--muted);max-width:68ch;margin:0 0 12px;font-size:clamp(14px,1.5cqi,17px)}
.metrics{display:flex;flex-wrap:wrap;gap:12px 40px;margin:0 0 22px}.metric b{display:block;font:400 clamp(26px,4cqi,46px)/1 Georgia,serif;color:var(--accent)}.metric span{font-size:13px;color:var(--muted)}
.count{margin:0;font-size:15px}.gaps{font-size:12px;color:var(--muted);margin:8px 0 0}
.points{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:10px;max-width:72ch}.points li{display:flex;gap:14px;align-items:baseline;font-size:clamp(15px,1.7cqi,19px)}.points i{font-style:normal;font-size:10px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;min-width:66px;text-align:center;padding:2px 6px;border-radius:4px;color:var(--card);background:var(--done)}
.state-moving i,.flow .state-moving{--s:var(--moving)}.state-blocked i,.flow .state-blocked{--s:var(--blocked)}.state-dropped i,.flow .state-dropped{--s:var(--dropped)}.state-risk i,.flow .state-risk{--s:var(--risk)}.points li i{background:var(--s,var(--done))}.state-dropped span{text-decoration:line-through;color:var(--muted)}
.figure{margin:6px 0 0;flex:1;min-height:0;display:flex;flex-direction:column}.figure img{max-width:100%;max-height:100%;min-height:0;object-fit:contain;border:1px solid var(--line);border-radius:8px;align-self:flex-start}figcaption{font-size:12px;color:var(--muted);margin-top:8px}
.flow{list-style:none;padding:0;margin:8px 0 0;display:flex;gap:28px;flex-wrap:wrap;counter-reset:f}.flow li{--s:var(--done);position:relative;flex:1 1 140px;border:1px solid var(--line);border-top:4px solid var(--s);border-radius:8px;padding:12px 14px;display:grid;gap:4px;background:var(--paper)}.flow li+li::before{content:"→";position:absolute;left:-22px;top:50%;transform:translateY(-50%);color:var(--muted)}.flow strong{font-size:15px}.flow span{font-size:13px;color:var(--muted)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:18px}.compare div{border:1px solid var(--line);border-radius:8px;padding:14px 18px;background:var(--paper)}.compare .after{border-color:var(--accent)}.compare b{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.compare .after b{color:var(--accent)}.compare p{margin:6px 0 0;white-space:pre-wrap}
pre{margin:0;overflow:auto;background:#1b2420;color:#dfe9e3;border-radius:8px;padding:14px 18px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.decision{border-color:var(--call);border-width:1px 1px 1px 6px}.decision .eyebrow{color:var(--call)}
.options{display:grid;grid-template-columns:repeat(var(--count),minmax(0,1fr));gap:12px;margin:6px 0 14px}
.option{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:5px;transition:border-color .15s,background .15s}.option:hover{border-color:var(--call)}.option strong{font-size:clamp(14px,1.6cqi,17px);line-height:1.3}.option>span:last-child{font-size:13px;color:var(--muted)}
.option[aria-pressed=true]{border:2px solid var(--call);background:var(--call-soft);padding:11px 13px}.option[aria-pressed=true] .option-head b::after{content:" · Your call";font-weight:700;color:var(--call)}
.option-head{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px}.option-head b{font-size:12px;margin-right:4px}.tag{border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.tag.rec{background:var(--rec);color:var(--accent)}.tag.current{background:var(--cur)}
.terms{display:grid;grid-template-columns:2fr 1.4fr 1fr 1fr;gap:6px 18px;margin:0 0 10px;font-size:13px}.terms div{min-width:0}.terms dt{font-size:10px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.terms dd{margin:2px 0 0}.rev-one-way{color:var(--blocked)}
.note-field{display:flex;flex-direction:column;gap:4px;font-size:10px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}textarea{resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:8px 10px;font-size:14px;letter-spacing:0;text-transform:none;font-weight:400}
.evidence{font-size:12px;color:var(--muted);margin:8px 0 0}
.say{margin:auto 0 0;padding-top:14px;border-top:1px dashed var(--line);font:italic clamp(14px,1.5cqi,17px)/1.5 Georgia,serif;color:var(--muted);max-width:80ch}.say span{font:700 10px/1 -apple-system,sans-serif;letter-spacing:.12em;text-transform:uppercase;font-style:normal;margin-right:10px}.quiet .say{display:none}
.recap{padding-left:22px;margin:8px 0 16px;display:grid;gap:8px;font-size:15px}.recap .q{display:block;color:var(--muted);font-size:13px}.recap .pick{font-weight:650}.recap .none{color:var(--muted)}
.actions{display:flex;gap:14px;align-items:center;margin:14px 0}.actions button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:10px 18px;font-weight:650}#copied{font-size:13px;color:var(--muted)}
.cooking{margin-top:auto;font-size:14px}.cooking b{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.cooking ul{margin:6px 0 0;padding-left:18px}
.nav{display:flex;align-items:center;gap:14px;padding:10px 20px 14px}.nav button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 14px}.track{flex:1;display:flex;gap:4px}.track button{flex:1;height:8px;padding:0;border:0;border-radius:4px;background:var(--line)}.track button.call{background:var(--call-soft);outline:1px solid var(--call)}.track button.seen{background:var(--accent)}.track button.call.seen{background:var(--call)}.track button[aria-current=true]{transform:scaleY(1.7)}
@media (max-width:760px){body{overflow:auto;display:block}.stage{display:block;padding:12px 16px}.slide{width:100%;aspect-ratio:auto;max-height:none;min-height:70vh;padding:24px 20px}.options,.terms,.compare{grid-template-columns:1fr}.flow{flex-direction:column;gap:22px}.flow li{flex:none}.flow li+li::before{content:"↓";left:16px;top:-20px;transform:none}.nav{position:sticky;bottom:0;background:var(--paper);padding:10px 16px}.bar .hint,.bar .deck-label{display:none}}
@media print{body{display:block;overflow:visible;background:#fff}.bar,.nav{display:none}.stage{display:block;padding:0}.slide{display:flex!important;page-break-after:always;break-after:page;width:100%;max-height:none;box-shadow:none;border-radius:0}textarea{display:none}}
</style>
</head>
<body>
<header class="bar"><span><b>@@TITLE@@</b><span class="deck-label"> · check-in</span></span><span class="right"><span class="hint">← → to move · V voiceover</span><span id="clock" title="Elapsed against the deck's time budget">0:00</span><span id="pos"></span><button type="button" id="voice" aria-pressed="true">Voiceover</button></span></header>
<main class="stage" id="stage">
@@SLIDES@@
</main>
<nav class="nav" aria-label="Slides"><button type="button" id="prev" aria-label="Previous slide">←</button><div class="track" id="track"></div><button type="button" id="next" aria-label="Next slide">→</button></nav>
<script type="application/json" id="meta">@@META@@</script>
<script>
(() => {
  const meta = JSON.parse(document.getElementById('meta').textContent);
  const slides = [...document.querySelectorAll('.slide')];
  const track = document.getElementById('track');
  const key = 'checkin:' + meta.deck;
  let state = {picks: {}, notes: {}, quiet: false};
  try { state = Object.assign(state, JSON.parse(localStorage.getItem(key)) || {}); } catch (e) {}
  const save = () => { try { localStorage.setItem(key, JSON.stringify(state)); } catch (e) {} };
  const budget = slides.reduce((t, s) => t + Number(s.dataset.seconds || 0), 0);
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  let current = 0, started = null;
  const seen = new Set();

  slides.forEach((s, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = s.dataset.kind === 'decision' ? 'call' : '';
    b.setAttribute('aria-label', 'Slide ' + (i + 1) + (s.dataset.kind === 'decision' ? ', a call for you' : ''));
    b.addEventListener('click', () => show(i));
    track.appendChild(b);
  });

  function show(i) {
    current = Math.max(0, Math.min(slides.length - 1, i));
    if (current > 0 && started === null) started = Date.now();
    seen.add(current);
    slides.forEach((s, n) => s.classList.toggle('active', n === current));
    [...track.children].forEach((b, n) => { b.classList.toggle('seen', seen.has(n)); b.setAttribute('aria-current', n === current); });
    document.getElementById('pos').textContent = (current + 1) + ' / ' + slides.length;
    if (slides[current].dataset.kind === 'close') recap();
    history.replaceState(null, '', '#' + (current + 1));
  }

  function pickText(c) {
    const i = state.picks[c.id];
    if (i === undefined) return null;
    let why = i === c.recommended ? 'matches the recommendation' : 'against the recommendation';
    if (c.timing === 'made') why += i === c.current ? ', keeps what is in place' : ', reverses what is in place';
    return c.options[i] + ' (' + why + ')';
  }

  function recap() {
    const list = document.getElementById('recap');
    list.innerHTML = '';
    meta.calls.forEach(c => {
      const li = document.createElement('li');
      const q = document.createElement('span'); q.className = 'q'; q.textContent = c.question;
      const p = document.createElement('span');
      const pick = pickText(c);
      p.className = pick ? 'pick' : 'none';
      p.textContent = pick || 'No call yet, so I go with: ' + c.default;
      li.append(q, p);
      if (state.notes[c.id]) { const n = document.createElement('span'); n.className = 'q'; n.textContent = 'Note: ' + state.notes[c.id]; li.append(n); }
      list.appendChild(li);
    });
  }

  function reply() {
    const lines = ['Check-in calls for ' + meta.project + ' (' + meta.date + ', deck ' + meta.deck + ')'];
    meta.calls.forEach((c, n) => {
      lines.push((n + 1) + '. ' + c.question);
      lines.push('   Call: ' + (pickText(c) || 'no call, go with your default: ' + c.default));
      if (state.notes[c.id]) lines.push('   Note: ' + state.notes[c.id]);
    });
    if (state.notes._general) lines.push('Also: ' + state.notes._general);
    return lines.join('\n');
  }

  document.querySelectorAll('.option').forEach(b => {
    const id = b.dataset.decision, opt = Number(b.dataset.option);
    b.setAttribute('aria-pressed', state.picks[id] === opt);
    b.addEventListener('click', () => {
      if (state.picks[id] === opt) delete state.picks[id]; else state.picks[id] = opt;
      document.querySelectorAll('.option[data-decision="' + id + '"]').forEach(o => o.setAttribute('aria-pressed', state.picks[id] === Number(o.dataset.option)));
      save();
    });
  });
  document.querySelectorAll('textarea[data-note]').forEach(t => {
    t.value = state.notes[t.dataset.note] || '';
    t.addEventListener('input', () => { state.notes[t.dataset.note] = t.value.trim(); save(); recap(); });
  });

  document.getElementById('copy').addEventListener('click', async () => {
    const text = reply(), done = document.getElementById('copied');
    try { await navigator.clipboard.writeText(text); done.textContent = 'Copied. Paste it back to me.'; }
    catch (e) {
      const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); done.textContent = 'Copied. Paste it back to me.'; } catch (err) { done.textContent = 'Copy failed. Select the recap and copy it by hand.'; }
      t.remove();
    }
  });

  const voice = document.getElementById('voice');
  const setQuiet = q => { state.quiet = q; document.body.classList.toggle('quiet', q); voice.setAttribute('aria-pressed', !q); save(); };
  voice.addEventListener('click', () => setQuiet(!state.quiet));
  setQuiet(!!state.quiet);

  document.getElementById('prev').addEventListener('click', () => show(current - 1));
  document.getElementById('next').addEventListener('click', () => show(current + 1));
  document.addEventListener('keydown', e => {
    if (e.target.closest('textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); show(current + 1); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); show(current - 1); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(slides.length - 1);
    else if (e.key === 'v' || e.key === 'V') setQuiet(!state.quiet);
  });
  let touch = null;
  document.getElementById('stage').addEventListener('touchstart', e => { touch = e.touches[0]; }, {passive: true});
  document.getElementById('stage').addEventListener('touchend', e => {
    if (!touch || e.target.closest('textarea,.option')) return;
    const dx = e.changedTouches[0].clientX - touch.clientX, dy = e.changedTouches[0].clientY - touch.clientY;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) show(current + (dx < 0 ? 1 : -1));
    touch = null;
  });
  setInterval(() => {
    const s = started === null ? 0 : (Date.now() - started) / 1000;
    document.getElementById('clock').textContent = fmt(s) + ' / ' + fmt(budget);
  }, 1000);

  const start = parseInt(location.hash.slice(1), 10);
  show(Number.isFinite(start) ? start - 1 : 0);
})();
</script>
</body>
</html>
